<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Palletizing Cell Factory – AR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --yellow: #ffc700;
    --steel: #1d2126;
    --steel-2: #2b3138;
    --paper: #f1f2f3;
    --ink: #14171a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfd3d8; font-family: "Barlow", system-ui, sans-serif; color: var(--ink); touch-action: none; }
  canvas { display: block; }

  /* Normal (non-AR) screen */
  #hud { position: fixed; inset: 0; pointer-events: none; padding: max(14px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; justify-content: space-between; }
  .title { align-self: flex-start; background: var(--steel); color: #fff; padding: 10px 14px 10px 12px; border-left: 8px solid var(--yellow); font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: 22px; line-height: 1.05; letter-spacing: .01em; }
  .title small { display: block; font-family: "Barlow", sans-serif; font-weight: 400; font-size: 12.5px; color: #b9c0c8; margin-top: 3px; letter-spacing: 0; }
  .panel { pointer-events: auto; align-self: stretch; max-width: 460px; background: var(--paper); border-top: 6px solid var(--yellow); padding: 14px; box-shadow: 0 6px 24px rgba(0,0,0,.25); }
  .panel p { margin: 0 0 12px; font-size: 15px; line-height: 1.4; }
  button { font-family: "Barlow Condensed", sans-serif; font-weight: 700; font-size: 20px; letter-spacing: .02em; border: 0; cursor: pointer; padding: 12px 18px; min-height: 48px; }
  button:focus-visible { outline: 3px solid #0b5fff; outline-offset: 2px; }
  #startAR { width: 100%; background: var(--yellow); color: var(--ink); }
  #startAR[disabled] { background: #b9bcc0; color: #55595e; cursor: not-allowed; }
  #spd3 { width: 100%; margin-top: 8px; background: var(--steel); color: #fff; font-size: 18px; min-height: 44px; }
  #note { margin-top: 10px; font-size: 13px; color: #4a5057; line-height: 1.35; }

  .zoom { position: fixed; right: max(12px, env(safe-area-inset-right)); top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 6px; pointer-events: auto; }
  .zoom button { background: var(--paper); color: var(--ink); width: 52px; min-height: 52px; padding: 0; font-size: 28px; line-height: 1; border-bottom: 4px solid var(--yellow); }

  /* AR overlay */
  #arui { position: fixed; inset: 0; display: none; pointer-events: none; flex-direction: column; justify-content: space-between; padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom)); }
  #gest { position: absolute; inset: 0; pointer-events: auto; touch-action: none; }
  #arui .hint, #arui .row { position: relative; z-index: 2; }
  #arui .hint { align-self: center; background: rgba(20,23,26,.88); color: #fff; padding: 10px 14px; font-size: 15px; text-align: center; max-width: 92vw; }
  #arui .row { pointer-events: auto; display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
  #arui .row button { background: rgba(241,242,243,.96); color: var(--ink); min-width: 64px; padding: 10px 12px; }
  #arui .row button.on { background: var(--yellow); }
  #arui .row button.exit { background: var(--steel); color: #fff; }
</style>
</head>
<body>

<div class="zoom" id="zoom3d"><button id="z3in" aria-label="Zoom in">+</button><button id="z3out" aria-label="Zoom out">&minus;</button></div>

<div id="hud">
  <div class="title">Palletizing factory<small>6 palletizing cells, 3 per side</small></div>
  <div class="panel">
    <p id="msg">Drag to look around. Pinch to zoom. To see it in your room, start AR and point the phone at the floor.</p>
    <button id="startAR" disabled>Checking AR support…</button>
    <button id="spd3">Speed: Calm</button>
    <div id="note"></div>
  </div>
</div>

<div id="arui">
  <div id="gest"></div>
  <div class="hint" id="arhint">Move the phone slowly over the floor, then tap the ring to place the factory.</div>
  <div class="row">
    <button id="zout" aria-label="Zoom out">&minus;</button>
    <button id="zin" aria-label="Zoom in">+</button>
    <button data-s="1">1:1</button>
    <button data-s="0.25" class="on">1:4</button>
    <button data-s="0.1">1:10</button>
    <button id="reset">Reset</button>
    <button id="spd">Calm</button>
    <button id="exit" class="exit">Exit AR</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/BufferGeometryUtils.js"></script>
<script>
(() => {
  // ------------------------------------------------------------------ renderer / scene
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.xr.enabled = true;
  document.body.prepend(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xcfd3d8);

  const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.05, 100);
  camera.position.set(0, 5.5, -5.5);
  if (innerWidth < innerHeight) camera.position.set(0, 10, -10);   // portrait phones need to stand further back
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.set(0, 0.3, 0.5);
  controls.enableDamping = true;
  controls.maxPolarAngle = Math.PI * 0.49;
  controls.minDistance = 1.2; controls.maxDistance = 30;
  controls.enableZoom = true;
  controls.update();

  // Soft reflections so metal and paint look right
  function makeEnv() {
    const pm = new THREE.PMREMGenerator(renderer);
    const s = new THREE.Scene();
    const c = document.createElement('canvas'); c.width = 4; c.height = 256;
    const g = c.getContext('2d');
    const gr = g.createLinearGradient(0, 0, 0, 256);
    gr.addColorStop(0, '#d6e6ff'); gr.addColorStop(0.5, '#e9e9ea'); gr.addColorStop(1, '#6d6d72');
    g.fillStyle = gr; g.fillRect(0, 0, 4, 256);
    const tex = new THREE.CanvasTexture(c);
    s.add(new THREE.Mesh(new THREE.SphereGeometry(50, 32, 16), new THREE.MeshBasicMaterial({ map: tex, side: THREE.BackSide })));
    const strip = new THREE.Mesh(new THREE.PlaneGeometry(30, 4), new THREE.MeshBasicMaterial({ color: 0xffffff }));
    strip.position.set(0, 40, 0); strip.rotation.x = Math.PI / 2; s.add(strip);
    const rt = pm.fromScene(s); pm.dispose();
    return rt.texture;
  }
  scene.environment = makeEnv();
  scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8f96, 0.5));

  // Everything lives in `factory` so AR can move / scale / rotate it as one piece
  const factory = new THREE.Group();
  scene.add(factory);

  const sun = new THREE.DirectionalLight(0xffffff, 1.2);
  sun.position.set(4, 8, -3);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.bias = -0.0005;
  factory.add(sun); factory.add(sun.target);
  function fitShadow(s) {
    const c = sun.shadow.camera;
    c.left = -7 * s; c.right = 7 * s; c.top = 7 * s; c.bottom = -7 * s; c.near = 0.5 * s; c.far = 30 * s;
    c.updateProjectionMatrix();
  }
  fitShadow(1);

  // ------------------------------------------------------------------ materials / helpers
  const M = (color, metalness = 0.1, roughness = 0.5) => new THREE.MeshStandardMaterial({ color, metalness, roughness });
  const mat = {
    blue: M(0x0a38cc, 0.2, 0.3), dark: M(0x1a1a1f, 0.3, 0.5), steel: M(0xb8bcc4, 0.9, 0.35),
    cream: M(0xd6c9a3, 0, 0.7), yellow: M(0xffc700, 0, 0.5), wood: M(0x9e7240, 0, 0.9),
    rubber: M(0x0a0a0a, 0, 0.9), grey: M(0x595e66, 0.3, 0.6), hose: M(0x0d2688, 0, 0.3),
    alu: M(0xd4d6da, 1, 0.3), brass: M(0xd99e38, 1, 0.35), orange: M(0xff6610, 0.2, 0.5),
    white: M(0xf0f1f2, 0.15, 0.35), grey2: M(0x4a4f55, 0.4, 0.5), silver: M(0xcfd3d8, 0.9, 0.25),
    card: M(0xc89b5e, 0, 0.9), tape: M(0xe0d2a8, 0, 0.8), convBlue: M(0x1f5fbf, 0.2, 0.5), cabinet: M(0x8a9096, 0.4, 0.5),
    screen: new THREE.MeshStandardMaterial({ color: 0x103a8a, emissive: 0x1a66ff, emissiveIntensity: 1.2 }),
    red: new THREE.MeshStandardMaterial({ color: 0xcc1111, emissive: 0xff2222, emissiveIntensity: 0.8 }),
    green: new THREE.MeshStandardMaterial({ color: 0x11aa33, emissive: 0x22ff55, emissiveIntensity: 0.8 })
  };

  // Wire-mesh fence texture (transparent background, alpha cut-out)
  const fenceCanvas = document.createElement('canvas'); fenceCanvas.width = fenceCanvas.height = 32;
  { const g = fenceCanvas.getContext('2d'); g.clearRect(0, 0, 32, 32); g.fillStyle = '#4d525c'; g.fillRect(0, 0, 3, 32); g.fillRect(0, 0, 32, 3); }
  const fenceTex = new THREE.CanvasTexture(fenceCanvas);
  fenceTex.wrapS = fenceTex.wrapT = THREE.RepeatWrapping;
  fenceTex.repeat.set(1.9 / 0.12, 1.32 / 0.12);
  fenceTex.generateMipmaps = false; fenceTex.minFilter = THREE.LinearFilter; fenceTex.encoding = THREE.sRGBEncoding;
  const fenceMat = new THREE.MeshStandardMaterial({ map: fenceTex, alphaTest: 0.5, side: THREE.DoubleSide, metalness: 0.5, roughness: 0.5 });

  const geoCache = new Map();
  const gBox = (w, h, d) => { const k = 'b' + w + ',' + h + ',' + d; if (!geoCache.has(k)) geoCache.set(k, new THREE.BoxGeometry(w, h, d)); return geoCache.get(k); };
  const gCyl = (d, l) => { const k = 'c' + d + ',' + l; if (!geoCache.has(k)) geoCache.set(k, new THREE.CylinderGeometry(d / 2, d / 2, l, 24)); return geoCache.get(k); };
  function put(geo, m, parent, x, y, z) { const o = new THREE.Mesh(geo, m); o.position.set(x, y, z); o.castShadow = true; o.receiveShadow = true; parent.add(o); return o; }
  const box = (p, w, h, d, x, y, z, m) => put(gBox(w, h, d), m, p, x, y, z);
  function cyl(p, dia, len, x, y, z, m, axis) {
    const o = put(gCyl(dia, len), m, p, x, y, z);
    if (axis === 'x') o.rotation.z = Math.PI / 2; else if (axis === 'z') o.rotation.x = Math.PI / 2;
    return o;
  }
  function pivot(p, x, y, z) { const g = new THREE.Group(); g.position.set(x, y, z); p.add(g); return g; }

  // Merge all static meshes of a group by material (fewer draw calls on phones)
  function bake(group) {
    group.updateMatrixWorld(true);
    const buckets = new Map();
    group.traverse(o => {
      if (!o.isMesh) return;
      const g = o.geometry.clone(); g.applyMatrix4(o.matrixWorld);
      const a = buckets.get(o.material) || []; a.push(g); buckets.set(o.material, a);
    });
    const out = new THREE.Group();
    buckets.forEach((arr, m) => {
      const o = new THREE.Mesh(THREE.BufferGeometryUtils.mergeBufferGeometries(arr), m);
      o.castShadow = true; o.receiveShadow = true; out.add(o);
    });
    return out;
  }

  // ------------------------------------------------------------------ palletizing cell constants
  const L1 = 0.7, L2 = 0.75, G = 0.195, SH = 0.55;               // arm links, tool offset, shoulder height
  const RB = new THREE.Vector3(0.45, 0, 0.45);                    // robot base
  const PAL = new THREE.Vector3(-0.45, 0, 0.45);                  // pallet centre
  const BX = 0.3, BY = 0.16, BZ = 0.2;                            // carton size
  const PAL_TOP = 0.08, CONV_TOP = 0.325;
  const PICK = new THREE.Vector3(-0.12, CONV_TOP + BY / 2, -0.45);   // carton waits here at the end of the conveyor
  const FEED = new THREE.Vector3(0.8, CONV_TOP + BY / 2, -0.45);     // carton enters here
  const clamp = (v, a, b) => Math.min(Math.max(v, a), b);
  const lift = (p, dy = 0.3) => new THREE.Vector3(p.x, p.y + dy, p.z);
  const toCyl = p => ({ yaw: Math.atan2(p.x - RB.x, p.z - RB.z), r: Math.hypot(p.x - RB.x, p.z - RB.z), y: p.y });
  const wrapPi = a => Math.atan2(Math.sin(a), Math.cos(a));

  // 4 layers on the pallet: 2x2 cartons, then 3 cartons turned 90 degrees, repeated (14 cartons)
  function stackPlan() {
    const plan = [];
    for (let L = 0; L < 4; L++) {
      const y = PAL_TOP + L * BY + BY / 2;
      if (L % 2 === 0) {
        for (const sz of [-0.1, 0.1]) for (const sx of [-0.15, 0.15]) plan.push({ p: new THREE.Vector3(PAL.x + sx, y, PAL.z + sz), phi: 0 });
      } else {
        for (const sx of [-0.2, 0, 0.2]) plan.push({ p: new THREE.Vector3(PAL.x + sx, y, PAL.z), phi: Math.PI / 2 });
      }
    }
    return plan;
  }

  // ------------------------------------------------------------------ static part of a cell
  function buildStatic() {
    const g = new THREE.Group(), p = 0.98;
    box(g, 1.92, 0.06, 1.92, 0, -0.47, 0, mat.dark);
    box(g, 1.9, 0.42, 1.9, 0, -0.23, 0, mat.cream);
    box(g, 1.86, 0.02, 1.86, 0, -0.01, 0, mat.steel);
    for (const x of [-p, p]) for (const z of [-p, p]) {
      box(g, 0.08, 2.1, 0.08, x, 0.55, z, mat.yellow);
      box(g, 0.16, 0.03, 0.16, x, -0.485, z, mat.dark);
    }
    for (const z of [-p, p]) box(g, 2.04, 0.06, 0.06, 0, 1.6, z, mat.yellow);
    for (const x of [-p, p]) box(g, 0.06, 0.06, 2.04, x, 1.6, 0, mat.yellow);

    const fp = (x, z, ry) => { const o = new THREE.Mesh(new THREE.PlaneGeometry(1.9, 1.32), fenceMat); o.position.set(x, 0.91, z); o.rotation.y = ry; g.add(o); };
    fp(0, p, 0); fp(-p, 0, Math.PI / 2); fp(p, 0, Math.PI / 2);
    box(g, 1.9, 0.25, 0.02, 0, 0.125, p, mat.grey);
    box(g, 0.02, 0.25, 1.9, -p, 0.125, 0, mat.grey);
    box(g, 0.02, 0.25, 1.9, p, 0.125, 0, mat.grey);
    box(g, 0.05, 1.6, 0.05, 0, 0.8, p, mat.yellow);
    box(g, 0.05, 1.6, 0.05, -p, 0.8, 0, mat.yellow);
    box(g, 0.05, 1.6, 0.05, p, 0.8, 0, mat.yellow);

    cyl(g, 0.07, 0.03, -p, 1.645, -p, mat.dark);
    cyl(g, 0.07, 0.02, -p, 1.89, -p, mat.dark);

    // roller conveyor with blue frame (runs along x at the front)
    box(g, 1.2, 0.04, 0.04, 0.3, 0.28, -0.62, mat.convBlue);
    box(g, 1.2, 0.04, 0.04, 0.3, 0.28, -0.28, mat.convBlue);
    for (const x of [-0.25, 0.85]) for (const dz of [-0.17, 0.17]) box(g, 0.05, 0.28, 0.05, x, 0.14, -0.45 + dz, mat.convBlue);
    box(g, 1.1, 0.03, 0.03, 0.3, 0.12, -0.45, mat.convBlue);
    for (let i = 0; i < 14; i++) cyl(g, 0.05, 0.3, -0.25 + i * 0.085, 0.30, -0.45, mat.silver, 'z');
    box(g, 0.03, 0.12, 0.34, -0.3, 0.37, -0.45, mat.dark);   // end stop

    // wooden pallet (0.6 x 0.4)
    for (const dx of [-0.24, 0, 0.24]) box(g, 0.06, 0.05, 0.4, PAL.x + dx, 0.025, PAL.z, mat.wood);
    for (const dz of [-0.15, -0.05, 0.05, 0.15]) box(g, 0.6, 0.03, 0.07, PAL.x, 0.065, PAL.z + dz, mat.wood);

    // electrical cabinet (front-left) with window, e-stop and handle
    const cx = -0.7, cz = -0.72;
    box(g, 0.4, 0.9, 0.28, cx, 0.45, cz, mat.cabinet);
    box(g, 0.2, 0.15, 0.01, cx, 0.65, cz - 0.145, mat.screen);
    cyl(g, 0.04, 0.02, cx - 0.1, 0.45, cz - 0.15, mat.red, 'z');
    cyl(g, 0.03, 0.02, cx + 0.1, 0.45, cz - 0.15, mat.green, 'z');
    box(g, 0.02, 0.12, 0.02, cx + 0.15, 0.3, cz - 0.15, mat.dark);

    // control pendant on a stand outside the front-right post
    const px = 1.15, pz = -0.6;
    cyl(g, 0.05, 1.5, px, 0.25, pz, mat.grey);
    box(g, 0.16, 0.3, 0.1, px, 1.1, pz, mat.cream);
    box(g, 0.11, 0.08, 0.005, px, 1.18, pz - 0.052, mat.screen);
    cyl(g, 0.05, 0.015, px - 0.04, 1.06, pz - 0.057, mat.yellow, 'z');
    cyl(g, 0.04, 0.02, px - 0.04, 1.06, pz - 0.072, mat.red, 'z');
    cyl(g, 0.03, 0.012, px + 0.04, 1.06, pz - 0.055, mat.green, 'z');
    return bake(g);
  }
  const staticTemplate = buildStatic();

  // ------------------------------------------------------------------ tweening that also runs inside AR
  const tweens = [];
  function tween(time, fn) { return new Promise(res => tweens.push({ t: 0, time: Math.max(time, 0.001), fn, res })); }
  const wait = s => tween(s, () => {});
  function stepTweens(dt) {
    for (let i = tweens.length - 1; i >= 0; i--) {
      const tw = tweens[i];
      tw.t = Math.min(1, tw.t + dt / tw.time);
      tw.fn(tw.t);
      if (tw.t >= 1) { tweens.splice(i, 1); tw.res(); }
    }
  }

  // ------------------------------------------------------------------ one cell (robot + animation)
  function makeLamp(hex) { return new THREE.MeshStandardMaterial({ color: new THREE.Color(hex).multiplyScalar(0.3), emissive: hex, emissiveIntensity: 0, roughness: 0.4 }); }
  function setLamp(m, hex, on) { m.color.set(hex).multiplyScalar(on ? 1 : 0.3); m.emissiveIntensity = on ? 1.6 : 0; }

  function makeCell(x, z, yawDeg, delay) {
    const cell = new THREE.Group();
    cell.position.set(x, 0.5, z);
    cell.rotation.y = yawDeg * Math.PI / 180;
    cell.add(staticTemplate.clone());

    // stack light
    const lG = makeLamp(0x22ff55), lA = makeLamp(0xff9900), lR = makeLamp(0xff2222);
    cyl(cell, 0.065, 0.07, -0.98, 1.695, -0.98, lG);
    cyl(cell, 0.065, 0.07, -0.98, 1.765, -0.98, lA);
    cyl(cell, 0.065, 0.07, -0.98, 1.835, -0.98, lR);
    const setState = s => { setLamp(lG, 0x22ff55, s === 1); setLamp(lA, 0xff9900, s === 0); setLamp(lR, 0xff2222, false); };
    setState(0);

    // ---- white 4-axis palletizing robot
    const r = new THREE.Group(); r.position.set(RB.x, 0, RB.z); cell.add(r);
    box(r, 0.55, 0.04, 0.55, 0, 0.02, 0, mat.grey2);
    for (const bx of [-0.22, 0.22]) for (const bz of [-0.22, 0.22]) cyl(r, 0.035, 0.015, bx, 0.047, bz, mat.steel);
    cyl(r, 0.42, 0.18, 0, 0.13, 0, mat.white);

    const baseJ = pivot(r, 0, 0.22, 0);
    cyl(baseJ, 0.36, 0.1, 0, 0.05, 0, mat.white);
    box(baseJ, 0.3, 0.34, 0.28, 0, 0.22, 0, mat.white);
    cyl(baseJ, 0.16, 0.12, -0.19, 0.28, 0, mat.grey2, 'x');
    cyl(baseJ, 0.12, 0.1, 0.19, 0.28, 0, mat.grey2, 'x');

    const shoulder = pivot(baseJ, 0, 0.33, 0);                     // shoulder axis at 0.55 m
    cyl(shoulder, 0.2, 0.26, 0, 0, 0, mat.white, 'x');
    cyl(shoulder, 0.14, 0.02, -0.14, 0, 0, mat.grey2, 'x');
    cyl(shoulder, 0.14, 0.02, 0.14, 0, 0, mat.grey2, 'x');
    box(shoulder, 0.15, L1 - 0.1, 0.16, 0, L1 / 2, 0, mat.white);
    cyl(shoulder, 0.04, L1 - 0.05, 0, L1 / 2, -0.15, mat.silver);   // parallel link

    const elbow = pivot(shoulder, 0, L1, 0);
    cyl(elbow, 0.17, 0.24, 0, 0, 0, mat.white, 'x');
    cyl(elbow, 0.12, 0.02, -0.13, 0, 0, mat.grey2, 'x');
    cyl(elbow, 0.12, 0.02, 0.13, 0, 0, mat.grey2, 'x');
    box(elbow, 0.11, L2 - 0.12, 0.13, 0, L2 / 2, 0, mat.white);
    cyl(elbow, 0.035, L2 - 0.05, 0, L2 / 2, 0.13, mat.silver);      // parallel link

    const wrist = pivot(elbow, 0, L2, 0);
    cyl(wrist, 0.12, 0.16, 0, 0, 0, mat.white, 'x');

    // gripper: stays vertical, rotates to turn cartons. Vacuum plate + two side clamps.
    const roll = pivot(wrist, 0, 0, 0);
    cyl(roll, 0.1, 0.03, 0, 0.02, 0, mat.grey2);
    cyl(roll, 0.08, 0.04, 0, 0.05, 0, mat.dark);
    box(roll, 0.42, 0.03, 0.26, 0, 0.08, 0, mat.grey2);
    for (const cx of [-0.1, 0, 0.1]) for (const cz of [-0.06, 0.06]) cyl(roll, 0.04, 0.02, cx, 0.105, cz, mat.rubber);
    const clampL = pivot(roll, -0.2, 0, 0), clampR = pivot(roll, 0.2, 0, 0);
    box(clampL, 0.01, 0.12, 0.19, 0, G, 0, mat.grey2);
    box(clampL, 0.012, 0.045, 0.12, 0, 0.115, 0, mat.dark);
    box(clampR, 0.01, 0.12, 0.19, 0, G, 0, mat.grey2);
    box(clampR, 0.012, 0.045, 0.12, 0, 0.115, 0, mat.dark);

    // state in joint space (so the arm swings in arcs like a real robot)
    const st = Object.assign({ phi: 0, grip: 1 }, toCyl(lift(PICK)));
    let stacked = [];
    const plan = stackPlan();

    function newCarton() {
      const g = new THREE.Group();
      put(gBox(BX, BY, BZ), mat.card, g, 0, 0, 0);
      put(gBox(0.045, BY + 0.002, BZ + 0.002), mat.tape, g, 0, 0, 0);
      cell.add(g);
      return g;
    }
    function feed() {
      const b = newCarton();
      b.position.copy(FEED);
      return tween(2.0, u => { b.position.x = FEED.x + (PICK.x - FEED.x) * u; }).then(() => b);
    }

    // inverse kinematics: two links reach (r, y); the wrist keeps the gripper vertical
    function update() {
      const h = st.y + G - SH;
      const d = clamp(Math.hypot(st.r, h), Math.abs(L1 - L2) + 0.01, L1 + L2 - 0.01);
      const phi = Math.atan2(st.r, h);
      const alpha = Math.acos(clamp((L1 * L1 + d * d - L2 * L2) / (2 * L1 * d), -1, 1));
      const beta = Math.acos(clamp((L1 * L1 + L2 * L2 - d * d) / (2 * L1 * L2), -1, 1));
      const a1 = phi - alpha, a2 = Math.PI - beta, a3 = Math.PI - a1 - a2;
      baseJ.rotation.y = st.yaw; shoulder.rotation.x = a1; elbow.rotation.x = a2; wrist.rotation.x = a3;
      roll.rotation.y = st.yaw - st.phi;
      const gap = 0.155 + 0.04 * st.grip;
      clampL.position.x = -gap; clampR.position.x = gap;
    }

    function move(pt, time, phi) {
      const f = { yaw: st.yaw, r: st.r, y: st.y, phi: st.phi };
      const t = toCyl(pt);
      t.yaw = f.yaw + wrapPi(t.yaw - f.yaw);
      const tp = f.phi + wrapPi(phi - f.phi);
      return tween(time, u => {
        const e = u * u * u * (u * (6 * u - 15) + 10);   // smootherstep: gentle start and stop
        st.yaw = f.yaw + (t.yaw - f.yaw) * e; st.r = f.r + (t.r - f.r) * e;
        st.y = f.y + (t.y - f.y) * e; st.phi = f.phi + (tp - f.phi) * e;
      });
    }
    const grip = (v, time) => { const f = st.grip; return tween(time, u => { st.grip = f + (v - f) * u; }); };

    async function run() {
      setState(0);
      await wait(delay); setState(1);
      for (;;) {
        let box = await feed();
        for (let i = 0; i < plan.length; i++) {
          const tgt = plan[i];
          await move(lift(PICK), 0.9, 0);
          await grip(1, 0.2);
          await move(PICK, 0.45, 0);                    // down onto the carton
          await grip(0, 0.3);                           // clamp
          await wait(0.1);
          roll.attach(box);
          const next = i + 1 < plan.length ? feed() : null;   // conveyor brings the next carton
          await move(lift(PICK), 0.45, 0);
          await move(lift(tgt.p, 0.28), 1.2, tgt.phi);  // swing over, turning the carton if needed
          await move(tgt.p, 0.5, tgt.phi);
          await grip(1, 0.3);                           // release
          cell.attach(box); stacked.push(box);
          await wait(0.1);
          await move(lift(tgt.p, 0.28), 0.45, tgt.phi);
          if (next) box = await next;
        }
        setState(0);
        await move(lift(PICK), 1.0, 0);
        await wait(2);                                   // full pallet leaves
        stacked.forEach(b => cell.remove(b)); stacked = [];
        await wait(0.5);
        setState(1);
      }
    }

    cell.userData.update = update;
    update();
    run();
    return cell;
  }

  // ------------------------------------------------------------------ build the factory: 3 cells per side
  const cells = [];
  [-2.8, 0, 2.8].forEach((z, n) => {
    cells.push(makeCell(-3.3, z, -90, 1 + n * 0.5));
    cells.push(makeCell(3.3, z, 90, 1.25 + n * 0.5));
  });
  cells.forEach(c => factory.add(c));

  // virtual room (3D view only)
  const room = new THREE.Group(); factory.add(room);
  const wallM = M(0xdfe3e8, 0, 0.9);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(10, 10).rotateX(-Math.PI / 2), M(0x777b82, 0, 0.9));
  floor.receiveShadow = true; room.add(floor);
  box(room, 10, 3, 0.1, 0, 1.5, 4.05, wallM);
  box(room, 0.1, 3, 10, -5.05, 1.5, 0, wallM);
  box(room, 0.1, 3, 10, 5.05, 1.5, 0, wallM);
  box(room, 0.08, 0.01, 8.5, -2.4, 0.005, 0, mat.yellow);   // aisle lines
  box(room, 0.08, 0.01, 8.5, 2.4, 0.005, 0, mat.yellow);

  // shadow catcher on the real floor (AR only)
  const shadowPlane = new THREE.Mesh(new THREE.PlaneGeometry(14, 14).rotateX(-Math.PI / 2), new THREE.ShadowMaterial({ opacity: 0.3 }));
  shadowPlane.position.y = 0.001; shadowPlane.receiveShadow = true; shadowPlane.visible = false; factory.add(shadowPlane);

  // ------------------------------------------------------------------ AR
  const startBtn = document.getElementById('startAR');
  const hud = document.getElementById('hud');
  const zoom3d = document.getElementById('zoom3d');
  const arui = document.getElementById('arui');
  const arhint = document.getElementById('arhint');
  const note = document.getElementById('note');
  arui.addEventListener('beforexrselect', e => e.preventDefault());

  const reticle = new THREE.Mesh(new THREE.RingGeometry(0.12, 0.16, 40).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0xffc700 }));
  reticle.matrixAutoUpdate = false; reticle.visible = false; scene.add(reticle);

  let animSpeed = 0.5;
  let inAR = false, placed = false, hitSource = null, scaleVal = 0.25, xrSession = null;

  function setScale(s) {
    scaleVal = s; factory.scale.setScalar(s); fitShadow(s);
    arui.querySelectorAll('button[data-s]').forEach(b => b.classList.toggle('on', parseFloat(b.dataset.s) === s));
  }
  // Zoom / rotate about the floor point under the screen centre, and never change the height,
  // so the factory stays glued to the floor while you zoom.
  function pivotPoint() { return reticle.visible ? new THREE.Vector3().setFromMatrixPosition(reticle.matrix) : factory.position.clone(); }
  function zoomBy(k) {
    const ns = clamp(scaleVal * k, 0.03, 2);
    if (!placed) { setScale(ns); return; }
    const kk = ns / scaleVal, c = pivotPoint();
    factory.position.x = c.x + (factory.position.x - c.x) * kk;
    factory.position.z = c.z + (factory.position.z - c.z) * kk;
    setScale(ns);
  }
  function rotateBy(da) {
    const c = pivotPoint();
    const off = new THREE.Vector3(factory.position.x - c.x, 0, factory.position.z - c.z).applyAxisAngle(new THREE.Vector3(0, 1, 0), da);
    factory.position.x = c.x + off.x; factory.position.z = c.z + off.z;
    factory.rotation.y += da;
  }
  arui.querySelectorAll('button[data-s]').forEach(b => b.addEventListener('click', () => zoomBy(parseFloat(b.dataset.s) / scaleVal)));
  document.getElementById('reset').addEventListener('click', () => { placed = false; factory.visible = false; arhint.textContent = 'Tap the ring on the floor to place the factory.'; });
  document.getElementById('exit').addEventListener('click', () => xrSession && xrSession.end());

  let hasHit = false;

  function onSelect() {
    const xc = renderer.xr.getCamera(camera);
    const dir = new THREE.Vector3(); xc.getWorldDirection(dir);
    if (reticle.visible) {
      factory.position.setFromMatrixPosition(reticle.matrix);
    } else if (!hasHit) {
      // No floor detection on this device: drop it 2 m ahead, about 1.4 m below the phone
      const p = new THREE.Vector3().setFromMatrixPosition(xc.matrixWorld);
      factory.position.set(p.x + dir.x * 2, p.y - 1.4, p.z + dir.z * 2);
    } else return;
    factory.rotation.y = Math.atan2(dir.x, dir.z);       // aisle runs away from you
    setScale(scaleVal);
    factory.visible = true; placed = true;
    arhint.textContent = 'Placed. Pinch to zoom, twist with two fingers to rotate, tap the floor to move it.';
  }

  async function requestXR() {
    const attempts = [
      { requiredFeatures: ['hit-test'], optionalFeatures: ['dom-overlay'], domOverlay: { root: arui } },
      { requiredFeatures: ['hit-test'] },
      { optionalFeatures: ['hit-test', 'dom-overlay'], domOverlay: { root: arui } },
      {}
    ];
    let lastErr;
    for (const opt of attempts) {
      try { return await navigator.xr.requestSession('immersive-ar', opt); } catch (e) { lastErr = e; }
    }
    throw lastErr;
  }

  async function startAR() {
    if (!window.isSecureContext) {
      note.textContent = 'AR needs a secure (https) page. Open the hosted link, not a file shared through WhatsApp or Files.';
      return;
    }
    arui.style.display = 'flex';
    try { xrSession = await requestXR(); }
    catch (e) { arui.style.display = 'none'; note.textContent = 'Could not start AR: ' + e.message + '. Make sure Google Play Services for AR is installed and updated.'; return; }

    renderer.xr.setReferenceSpaceType('local');
    await renderer.xr.setSession(xrSession);
    hasHit = false; hitSource = null;
    try {
      const viewer = await xrSession.requestReferenceSpace('viewer');
      hitSource = await xrSession.requestHitTestSource({ space: viewer });
      hasHit = !!hitSource;
    } catch (e) { hitSource = null; }
    xrSession.addEventListener('select', onSelect);
    xrSession.addEventListener('end', endAR);

    inAR = true; placed = false;
    scene.background = null;
    room.visible = false; shadowPlane.visible = true; factory.visible = false;
    hud.style.display = 'none'; zoom3d.style.display = 'none'; arui.style.display = 'flex';
    arhint.textContent = hasHit
      ? 'Move the phone slowly over the floor, then tap the ring to place the factory.'
      : 'Floor detection is not available here. Aim ahead and tap to place the factory about 2 m in front of you.';
    setScale(0.25);
  }

  function endAR() {
    inAR = false; hitSource = null; xrSession = null; reticle.visible = false;
    scene.background = new THREE.Color(0xcfd3d8);
    room.visible = true; shadowPlane.visible = false;
    factory.visible = true; factory.position.set(0, 0, 0); factory.rotation.set(0, 0, 0); factory.scale.setScalar(1); fitShadow(1);
    hud.style.display = 'flex'; zoom3d.style.display = 'flex'; arui.style.display = 'none';
  }

  // animation speed: Slow / Calm / Normal (default Calm)
  const SPEEDS = [['Slow', 0.3], ['Calm', 0.5], ['Normal', 1]];
  let speedIdx = 1;
  const spdBtn = document.getElementById('spd'), spdBtn3 = document.getElementById('spd3');
  function cycleSpeed() {
    speedIdx = (speedIdx + 1) % SPEEDS.length;
    animSpeed = SPEEDS[speedIdx][1];
    spdBtn.textContent = SPEEDS[speedIdx][0];
    spdBtn3.textContent = 'Speed: ' + SPEEDS[speedIdx][0];
  }
  spdBtn.addEventListener('click', cycleSpeed);
  spdBtn3.addEventListener('click', cycleSpeed);

  // zoom buttons (3D view)
  function dolly(f) {
    const v = camera.position.clone().sub(controls.target).multiplyScalar(f);
    const len = clamp(v.length(), controls.minDistance, controls.maxDistance);
    camera.position.copy(controls.target).add(v.setLength(len));
    controls.update();
  }
  document.getElementById('z3in').addEventListener('click', () => dolly(0.8));
  document.getElementById('z3out').addEventListener('click', () => dolly(1.25));

  // zoom buttons (AR)
  document.getElementById('zin').addEventListener('click', () => zoomBy(1.25));
  document.getElementById('zout').addEventListener('click', () => zoomBy(1 / 1.25));

  // AR touch gestures on a transparent layer: tap = place, pinch = zoom, two-finger twist = rotate
  const gest = document.getElementById('gest');
  gest.addEventListener('beforexrselect', e => e.preventDefault());
  const tdist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  const tang = t => Math.atan2(t[1].clientY - t[0].clientY, t[1].clientX - t[0].clientX);
  let gs = null;
  gest.addEventListener('touchstart', e => {
    e.preventDefault();
    if (e.touches.length === 1) gs = { mode: 'tap', x: e.touches[0].clientX, y: e.touches[0].clientY, moved: false };
    else if (e.touches.length === 2) gs = { mode: 'pinch', d0: tdist(e.touches), a0: tang(e.touches), prevD: 0, prevA: 0, lock: null };
  }, { passive: false });
  gest.addEventListener('touchmove', e => {
    e.preventDefault();
    if (!gs) return;
    if (gs.mode === 'tap' && e.touches.length === 1) {
      if (Math.hypot(e.touches[0].clientX - gs.x, e.touches[0].clientY - gs.y) > 12) gs.moved = true;
    } else if (gs.mode === 'pinch' && e.touches.length === 2 && placed) {
      const d = tdist(e.touches), a = tang(e.touches);
      if (!gs.lock) {                                   // decide once: is this a pinch or a twist?
        const dd = Math.abs(d - gs.d0), da = Math.abs(wrapPi(a - gs.a0)) * gs.d0 / 2;
        if (Math.max(dd, da) > 12) { gs.lock = dd >= da ? 'zoom' : 'rotate'; gs.prevD = d; gs.prevA = a; }
      } else if (gs.lock === 'zoom') { zoomBy(d / gs.prevD); gs.prevD = d; }
      else { rotateBy(-wrapPi(a - gs.prevA)); gs.prevA = a; }
    }
  }, { passive: false });
  gest.addEventListener('touchend', e => {
    e.preventDefault();
    if (gs && gs.mode === 'tap' && !gs.moved && e.touches.length === 0) onSelect();
    gs = e.touches.length === 0 ? null : { mode: 'tap', moved: true, x: 0, y: 0 };
  }, { passive: false });

  startBtn.addEventListener('click', startAR);

  (async () => {
    if (!navigator.xr) {
      startBtn.textContent = 'AR not available here';
      note.textContent = 'Open this page in Chrome on an Android phone with Google Play Services for AR. iPhone Safari does not support web AR. The 3D view above still works.';
      return;
    }
    let ok = false;
    try { ok = await navigator.xr.isSessionSupported('immersive-ar'); } catch (e) {}
    if (ok) { startBtn.disabled = false; startBtn.textContent = 'View in my room (AR)'; }
    else {
      startBtn.textContent = 'AR not supported on this device';
      note.textContent = 'On Android, use Chrome and install Google Play Services for AR from the Play Store. The page must be opened over https. The 3D view still works.';
    }
  })();

  // ------------------------------------------------------------------ loop
  const clock = new THREE.Clock();
  renderer.setAnimationLoop((time, frame) => {
    const dt = Math.min(clock.getDelta(), 0.05);
    if (factory.visible) stepTweens(dt * animSpeed);          // robots wait until the factory is placed
    cells.forEach(c => c.userData.update());

    if (inAR && frame && hitSource) {
      const hits = frame.getHitTestResults(hitSource);
      if (hits.length) {
        const pose = hits[0].getPose(renderer.xr.getReferenceSpace());
        reticle.visible = true; reticle.matrix.fromArray(pose.transform.matrix);
      } else reticle.visible = false;
    }
    if (!inAR) controls.update();
    renderer.render(scene, camera);
  });

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
})();
</script>
</body>
</html>
